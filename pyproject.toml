[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrmypdf-gui"
version = "0.1.0"
description = "Desktop GUI for OCRmyPDF on Windows - make scanned PDFs searchable"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "ocrmypdf>=17.0",
    "PySide6>=6.7",
    "pikepdf>=8.0",
    "pillow>=10.0",
    "img2pdf>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that run real OCR against installed Tesseract",
]
